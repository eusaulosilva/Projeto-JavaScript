<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calcule a idade completa em anos e o total de horas vividas entre duas datas.">
    <title>Idade em Horas — Projeto JavaScript</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <script defer src="../assets/js/core/ui.js"></script>
    <script defer src="../assets/js/core/validators.js"></script>
    <script defer src="../assets/js/pages/idade.js"></script>
</head>

<body>
    <div class="page-shell">
        <nav class="top-nav" aria-label="Navegação">
            <a class="back-link" href="../index.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Voltar ao início
            </a>
        </nav>

        <main class="tool-panel">
            <header class="tool-panel-header">
                <h1>Idade em Horas</h1>
                <p>Informe a data de nascimento e a data de referência para calcular o total de horas vividas.</p>
            </header>

            <form id="tool-form" class="tool-form" data-mode="hours" novalidate>
                <div class="field">
                    <label for="data-nascimento">Data de Nascimento</label>
                    <input id="data-nascimento" name="dataNascimento" type="date" class="input-control" required>
                </div>

                <div class="field">
                    <label for="data-atual">Data de Referência</label>
                    <input id="data-atual" name="dataAtual" type="date" class="input-control" required>
                </div>

                <div class="form-actions">
                    <button type="button" id="btn-reset" class="btn btn-secondary">Limpar</button>
                    <button type="submit" class="btn btn-primary">Calcular Horas</button>
                </div>
            </form>

            <section id="result" class="result-panel" aria-live="polite">
                <p class="result-placeholder">Preencha os dados acima para ver o resultado.</p>
            </section>
        </main>
    </div>
</body>

</html>
