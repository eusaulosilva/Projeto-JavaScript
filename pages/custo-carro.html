<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calculadora de custo final de veículo com percentual do distribuidor e impostos.">
    <title>Custo do Carro — Projeto JavaScript</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <script defer src="../assets/js/core/ui.js"></script>
    <script defer src="../assets/js/core/validators.js"></script>
    <script defer src="../assets/js/pages/custo-carro.js"></script>
</head>

<body>
    <div class="page-shell">
        <nav class="top-nav" aria-label="Navegação">
            <a class="back-link" href="../index.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Voltar ao início
            </a>
        </nav>

        <main class="tool-panel">
            <header class="tool-panel-header">
                <h1>Custo do Carro</h1>
                <p>Calcule o preço final ao consumidor considerando margem do distribuidor e impostos.</p>
            </header>

            <form id="tool-form" class="tool-form" novalidate>
                <div class="field">
                    <label for="custo-fabrica">Valor de Fábrica (R$)</label>
                    <input id="custo-fabrica" name="custoFabrica" type="number" class="input-control" step="any" min="0" inputmode="decimal" placeholder="Ex.: 50000" required>
                </div>

                <div class="field">
                    <label for="percentual-distribuidor">Porcentagem do Distribuidor (%)</label>
                    <input id="percentual-distribuidor" name="distribuidor" type="number" class="input-control" step="any" min="0" inputmode="decimal" placeholder="Ex.: 28" required>
                </div>

                <div class="field">
                    <label for="percentual-impostos">Impostos (%)</label>
                    <input id="percentual-impostos" name="impostos" type="number" class="input-control" step="any" min="0" inputmode="decimal" placeholder="Ex.: 45" required>
                </div>

                <div class="form-actions">
                    <button type="button" id="btn-reset" class="btn btn-secondary">Limpar</button>
                    <button type="submit" class="btn btn-primary">Calcular Custo</button>
                </div>
            </form>

            <section id="result" class="result-panel" aria-live="polite">
                <p class="result-placeholder">Preencha os dados acima para ver o resultado.</p>
            </section>
        </main>
    </div>
</body>

</html>
