<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calculadora de gorjeta do garçom (10% padrão ou personalizada) com divisão por pessoa.">
    <title>10% do Garçom — Projeto JavaScript</title>
    <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <script defer src="../assets/js/core/ui.js"></script>
    <script defer src="../assets/js/core/validators.js"></script>
    <script defer src="../assets/js/pages/gorjeta.js"></script>
</head>

<body>
    <div class="page-shell">
        <nav class="top-nav" aria-label="Navegação">
            <a class="back-link" href="../index.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Voltar ao início
            </a>
        </nav>

        <main class="tool-panel">
            <header class="tool-panel-header">
                <h1>10% do Garçom</h1>
                <p>Calcule a taxa de serviço (10% padrão ou personalizada) e divida o total entre pessoas.</p>
            </header>

            <form id="tool-form" class="tool-form" novalidate>
                <div class="field">
                    <label for="valor-conta">Valor da Conta (R$)</label>
                    <input id="valor-conta" name="valorConta" type="number" class="input-control" step="any" min="0" inputmode="decimal" placeholder="Ex.: 145.50" required>
                </div>

                <div class="field-grid">
                    <div class="field">
                        <label for="taxa-gorjeta">Taxa (%)</label>
                        <input id="taxa-gorjeta" name="taxaGorjeta" type="number" class="input-control" step="any" min="0" max="100" value="10" inputmode="decimal" required>
                    </div>

                    <div class="field">
                        <label for="pessoas">Dividir por pessoas</label>
                        <input id="pessoas" name="pessoas" type="number" class="input-control" step="1" min="1" max="200" value="1" inputmode="numeric" required>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" id="btn-reset" class="btn btn-secondary">Limpar</button>
                    <button type="submit" class="btn btn-primary">Calcular Conta</button>
                </div>
            </form>

            <section id="result" class="result-panel" aria-live="polite">
                <p class="result-placeholder">Preencha os dados acima para ver o resultado.</p>
            </section>
        </main>
    </div>
</body>

</html>
