<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calculadora de percentuais eleitorais para votos válidos, nulos e brancos.">
    <title>Apuração de Votos — Projeto JavaScript</title>
    <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <script defer src="../assets/js/core/ui.js"></script>
    <script defer src="../assets/js/core/validators.js"></script>
    <script defer src="../assets/js/pages/eleicao.js"></script>
</head>

<body>
    <div class="page-shell">
        <nav class="top-nav" aria-label="Navegação">
            <a class="back-link" href="../index.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Voltar ao início
            </a>
        </nav>

        <main class="tool-panel">
            <header class="tool-panel-header">
                <h1>Apuração de Votos</h1>
                <p>Informe a quantidade de votos válidos, nulos e brancos para calcular os percentuais.</p>
            </header>

            <form id="tool-form" class="tool-form" novalidate>
                <div class="field">
                    <label for="votos-validos">Votos Válidos</label>
                    <input id="votos-validos" name="votosValidos" type="number" class="input-control" step="1" min="0" inputmode="numeric" placeholder="Ex.: 1250" required>
                </div>

                <div class="field">
                    <label for="votos-nulos">Votos Nulos</label>
                    <input id="votos-nulos" name="votosNulos" type="number" class="input-control" step="1" min="0" inputmode="numeric" placeholder="Ex.: 85" required>
                </div>

                <div class="field">
                    <label for="votos-brancos">Votos Brancos</label>
                    <input id="votos-brancos" name="votosBrancos" type="number" class="input-control" step="1" min="0" inputmode="numeric" placeholder="Ex.: 40" required>
                </div>

                <div class="form-actions">
                    <button type="button" id="btn-reset" class="btn btn-secondary">Limpar</button>
                    <button type="submit" class="btn btn-primary">Apurar Votos</button>
                </div>
            </form>

            <section id="result" class="result-panel" aria-live="polite">
                <p class="result-placeholder">Preencha os dados acima para ver o resultado.</p>
            </section>
        </main>
    </div>
</body>

</html>
